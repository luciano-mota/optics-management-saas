spring:
  application:
    name: optics-management
  datasource:
    url: ${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:optics_management}}
    username: ${DB_USERNAME:optics}
    password: ${DB_PASSWORD:}
  mail:
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 15000
          timeout: 15000
          writetimeout: 15000
  session:
    store-type: jdbc
    jdbc:
      initialize-schema: never
    timeout: 45m
  flyway:
    enabled: true
    baseline-on-migrate: false
  jackson:
    time-zone: America/Sao_Paulo
server:
  port: ${PORT:8080}
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
        secure: ${COOKIE_SECURE:false}
management:
  health:
    mail:
      enabled: false # O SMTP é opcional na HML; enviar convite verifica SMTP separadamente.
  endpoints:
    web:
      exposure:
        include: health

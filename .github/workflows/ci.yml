name: CI
on:
  push:
    branches: [main, hml]
  pull_request:
    branches: [main, hml]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: optics
          POSTGRES_PASSWORD: local-dev-only
          POSTGRES_DB: optics_management
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U optics -d optics_management"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_URL: jdbc:postgresql://localhost:5432/optics_management
      DB_USERNAME: optics
      DB_PASSWORD: local-dev-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Testar backend e migrations
        working-directory: backend
        run: mvn -B verify
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependências
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Verificar TypeScript e gerar build
        working-directory: frontend
        run: npm run build

  docker-smoke:
    name: Docker + API + PostgreSQL
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: optics
          POSTGRES_PASSWORD: local-dev-only
          POSTGRES_DB: optics_management
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U optics -d optics_management"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Construir imagem de homologação completa
        run: docker build --tag optics-management-smoke:latest .
      - name: Iniciar app e conectar ao PostgreSQL
        run: |
          docker run --detach --name optics-management-smoke --network host \
            -e DB_HOST=127.0.0.1 -e DB_PORT=5432 -e DB_NAME=optics_management \
            -e DB_USERNAME=optics -e DB_PASSWORD=local-dev-only \
            -e COOKIE_SECURE=false -e PORT=8080 \
            optics-management-smoke:latest
      - name: Testar HTTP real, banco, SPA e segurança
        run: |
          set -euo pipefail
          healthy=0
          for i in $(seq 1 50); do
            if curl -fsS --max-time 4 http://127.0.0.1:8080/actuator/health | grep -q '"status":"UP"'; then
              healthy=1
              break
            fi
            sleep 3
          done
          if [ "$healthy" -ne 1 ]; then
            docker logs optics-management-smoke --tail 250
            exit 1
          fi
          curl -fsS http://127.0.0.1:8080/ | grep -q 'Optics Management'
          curl -fsS http://127.0.0.1:8080/api/v1/public/status | grep -q 'optics-management'
          curl -fsS http://127.0.0.1:8080/manifest.webmanifest | grep -q 'Optics Management'
          response=$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/api/v1/customers)
          test "$response" = '401'
      - name: Mostrar logs em caso de falha
        if: failure()
        run: docker logs optics-management-smoke --tail 350 || true

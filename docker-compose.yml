services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: optics_management
      POSTGRES_USER: optics
      POSTGRES_PASSWORD: local-dev-only
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - optics_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U optics -d optics_management"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  optics_pgdata:
